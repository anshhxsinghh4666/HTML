<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .header {
      text-align: center;
      background-color: rgb(29, 141, 182);
      font-weight: bold;
      border: 1px solid black;
    }

    .data {
      text-align: center;
      border: 1px solid black;
    }
  </style>
</head>

<body>
  <table style="border-collapse: collapse; width: 60%">
    <caption style="text-align: center; font-weight: bolder; font-size: large;">BOOK DETAILS</caption>
    <thead>
      <tr>
        <th class="header">BOOK</th>
        <th class="header">Title</th>
        <th class="header">Author</th>
        <th class="header">Price</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="data">b101</td>
        <td class="data">HTML Basics</td>
        <td class="data">Alice</td>
        <td class="data">450</td>
      </tr>
    </tbody>
  </table>

  <button style="background-color: green; text-align: centre; color: white">SUBMIT</button>
  <button style="background-color: red; text-align: centre; color: white">RESET</button>
</body>

</html>
